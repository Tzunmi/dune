<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dune GF9 Tournament Clock</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="app-header">
        <h1>Dune GF9 Tournament Clock</h1>
    </header>

    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="app-container">

        <!-- Game Timer -->
        <section class="game-timer-section">

            <h2>Game Time</h2>

            <div id="gameTimer" class="game-timer">
                00:00:00
            </div>

            <div class="timer-controls">

                <button id="startBtn">
                    Start
                </button>

                <button id="pauseBtn">
                    Pause
                </button>

                <button id="resetBtn">
                    Reset
                </button>

            </div>

        </section>

        <!-- Players -->
        <section class="players-section">

            <h2>Players</h2>

            <div class="players-grid">

                <article class="player-card" id="player1">
                    <h3>Player 1</h3>
                    <p class="player-time">00:00:00</p>
                </article>

                <article class="player-card" id="player2">
                    <h3>Player 2</h3>
                    <p class="player-time">00:00:00</p>
                </article>

                <article class="player-card" id="player3">
                    <h3>Player 3</h3>
                    <p class="player-time">00:00:00</p>
                </article>

                <article class="player-card" id="player4">
                    <h3>Player 4</h3>
                    <p class="player-time">00:00:00</p>
                </article>

                <article class="player-card" id="player5">
                    <h3>Player 5</h3>
                    <p class="player-time">00:00:00</p>
                </article>

                <article class="player-card" id="player6">
                    <h3>Player 6</h3>
                    <p class="player-time">00:00:00</p>
                </article>

            </div>

        </section>

    </main>

    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="app-footer">
        <p>Version 0.1</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
